<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Беспроторница — кооперативная игра на выживание.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Беспроторница">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Беспроторница</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #offline-status {
      position: fixed;
      z-index: 10000;
      inset: auto 12px 12px 12px;
      max-width: 560px;
      margin: auto;
      padding: 10px 14px;
      border: 1px solid #94734d;
      border-radius: 10px;
      background: #211a15;
      color: #f2e7d5;
      font: 14px/1.4 system-ui, sans-serif;
      box-shadow: 0 4px 18px #0008;
    }
    #offline-status[hidden] { display: none; }
    #offline-install { margin-left: 10px; }
  </style>
</head>
<body>
  <div id="offline-status" role="status" aria-live="polite" hidden>
    <span id="offline-status-text"></span>
    <button id="offline-install" type="button" hidden>Установить</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (() => {
      const status = document.getElementById('offline-status');
      const label = document.getElementById('offline-status-text');
      const install = document.getElementById('offline-install');
      let installPrompt;
      let offlineReady = false;
      let installed = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      const show = () => {
        status.hidden = false;
        label.textContent = offlineReady
          ? (installed ? 'Приложение установлено и готово к офлайн-игре.' : 'Офлайн-запуск готов. Приложение можно установить для быстрого запуска.')
          : 'Подготовка офлайн-запуска…';
        install.hidden = !installPrompt || installed;
      };
      const requestStatus = (worker) => worker?.postMessage({ type: 'GET_OFFLINE_STATUS' });

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        installPrompt = event;
        show();
      });
      install.addEventListener('click', async () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = undefined;
        show();
      });
      window.addEventListener('appinstalled', () => {
        installed = true;
        installPrompt = undefined;
        show();
      });

      if (!('serviceWorker' in navigator)) {
        label.textContent = 'Офлайн-запуск недоступен в этом браузере.';
        status.hidden = false;
        return;
      }
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data?.type !== 'OFFLINE_STATUS') return;
        offlineReady = event.data.ready === true;
        show();
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        requestStatus(navigator.serviceWorker.controller);
      });
      window.addEventListener('load', () => {
        if (!navigator.onLine && navigator.serviceWorker.controller) {
          requestStatus(navigator.serviceWorker.controller);
          return;
        }
        navigator.serviceWorker.register('service_worker.js', { scope: './' })
          .then((registration) => requestStatus(registration.active || registration.waiting || registration.installing))
          .catch(() => {
            label.textContent = 'Не удалось подготовить офлайн-запуск. Проверьте подключение и перезагрузите страницу.';
            status.hidden = false;
          });
      });
    })();
  </script>
</body>
</html>
