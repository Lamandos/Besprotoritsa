name: besprotoritsa_app
description: Flutter user interface for Besprotoritsa.
version: 0.2.0-alpha+1
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  besprotoritsa_data:
    path: ../besprotoritsa_data
  besprotoritsa_rules:
    path: ../besprotoritsa_rules
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  http: ^1.3.0
  path_provider: ^2.1.5
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  besprotoritsa_server:
    path: ../besprotoritsa_server
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shelf: ^1.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/card-backgrounds/
    - assets/images/character-portraits/
    - assets/images/card-icons/
    - assets/images/card-art/
    - assets/images/field-tiles/
    - assets/images/sleeping_black_cat_dark_room/
