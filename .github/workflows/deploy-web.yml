name: Deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
      - run: flutter pub get
      - name: Build web application
        working-directory: packages/besprotoritsa_app
        run: >-
          flutter build web --release --pwa-strategy=offline-first
          --base-href="/Besprotoritsa/" --wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/besprotoritsa_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
