name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/besprotoritsa_app/web/package-lock.json
      - name: Run web bootstrap tests
        working-directory: packages/besprotoritsa_app/web
        run: npm ci && npm test
      - name: Install Linux desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Run local quality checks, including content validation
        run: ./tool/run_checks.sh
      - name: Build server Docker image
        run: docker build -f packages/besprotoritsa_server/Dockerfile -t besprotoritsa-server:ci .
